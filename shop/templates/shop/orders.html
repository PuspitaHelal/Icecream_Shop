{% extends 'base.html' %}
{% block content %}
<h1>Your Orders</h1>
{% if orders %}
    <ul>
    {% for order in orders %}
        <li>Order #{{ order.id }} | Total: ${{ order.total_price }} | Date: {{ order.created_at }}</li>
    {% endfor %}
    </ul>
{% else %}
    <p>No orders yet.</p>
{% endif %}
{% endblock %}
